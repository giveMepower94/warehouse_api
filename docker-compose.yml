services:
  web:
    build: .
    container_name: warehouse_web
    command: poetry run gunicorn warehouse.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:17
    container_name: warehouse_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: warehouse_redis
    ports:
      - "6379:6379"

  celery:
    build: .
    container_name: warehouse_celery
    command: celery -A warehouse worker --loglevel=INFO
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    container_name: warehouse_celery_beat
    command: celery -A warehouse beat --loglevel=INFO
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data: